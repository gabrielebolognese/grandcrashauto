<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7fc8e8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Coastline — a sunny low-poly city driving sandbox. Drive, customize, crash." />
    <title>Coastline</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff8a5b'/%3E%3Cpath d='M10 40h44l-6-12H22z' fill='%23fff'/%3E%3Ccircle cx='22' cy='42' r='5' fill='%23333'/%3E%3Ccircle cx='44' cy='42' r='5' fill='%23333'/%3E%3C/svg%3E" />
    <style>
      /* Critical boot styles only — the UI module owns the rest (src/ui). */
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #8fd0ec;
        overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; position: absolute; inset: 0; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #boot, #fatal {
        position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(180deg, #7cc6ea 0%, #bfe6f3 55%, #ffd9a8 100%); color: #20324a; text-align: center;
      }
      #boot h1 { font-size: clamp(36px, 9vmin, 84px); letter-spacing: .08em; margin: 0 0 .2em; font-weight: 800; color: #fff; text-shadow: 0 4px 0 #ff8a5b, 0 8px 24px rgba(0,0,0,.18); }
      #boot .bar { width: min(60vw, 420px); height: 10px; border-radius: 6px; background: rgba(255,255,255,.55); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #ff8a5b, #ffb36b); transition: width .25s; }
      #boot .label { margin-top: 12px; font-size: 14px; opacity: .75; min-height: 1.2em; }
      #fatal { display: none; z-index: 1001; padding: 24px; box-sizing: border-box; }
      #fatal p { max-width: 520px; font-size: 18px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui-root"></div>
    <div id="boot">
      <h1>COASTLINE</h1>
      <div class="bar"><i id="boot-bar"></i></div>
      <div class="label" id="boot-label">Loading…</div>
    </div>
    <div id="fatal"><h2>Can't start the game</h2><p></p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
